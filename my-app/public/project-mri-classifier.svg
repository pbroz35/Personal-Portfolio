<svg width="384" height="240" viewBox="0 0 384 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mriBg" x1="0" y1="0" x2="384" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#181B3A"/>
      <stop offset="1" stop-color="#0E1024"/>
    </linearGradient>
    <linearGradient id="mriAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD8FF"/>
      <stop offset="1" stop-color="#CBACF9"/>
    </linearGradient>
    <radialGradient id="mriGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7DD8FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7DD8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="384" height="240" fill="url(#mriBg)"/>
  <circle cx="192" cy="104" r="120" fill="url(#mriGlow)"/>

  <!-- brain outline -->
  <g transform="translate(192,108)">
    <path d="M-46,-8
             C-50,-30 -30,-46 -10,-42
             C-2,-50 14,-50 22,-42
             C42,-46 56,-28 50,-8
             C58,-2 58,14 48,20
             C50,36 36,48 20,44
             C12,52 -6,52 -14,44
             C-32,50 -48,38 -46,20
             C-56,14 -56,-2 -46,-8 Z"
          fill="none" stroke="url(#mriAccent)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- sulci detail lines -->
    <g stroke="#5B7FB8" stroke-width="1.4" fill="none" opacity="0.75" stroke-linecap="round">
      <path d="M-34,-18 C-26,-24 -18,-22 -14,-14"/>
      <path d="M-6,-30 C0,-24 2,-16 -2,-10"/>
      <path d="M16,-28 C24,-22 26,-12 20,-6"/>
      <path d="M-38,4 C-30,0 -22,4 -20,12"/>
      <path d="M-2,4 C6,0 14,4 14,12"/>
      <path d="M28,6 C34,10 34,20 26,24"/>
      <path d="M-30,26 C-22,30 -12,28 -8,22"/>
      <path d="M2,30 C10,34 18,30 20,24"/>
    </g>

    <!-- tumor target -->
    <circle cx="10" cy="-4" r="7" fill="#F2668B" opacity="0.85"/>
    <circle cx="10" cy="-4" r="14" fill="none" stroke="#F2668B" stroke-width="1.5" opacity="0.6"/>
    <circle cx="10" cy="-4" r="22" fill="none" stroke="#F2668B" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.45"/>
  </g>

  <!-- scan line -->
  <rect x="60" y="34" width="264" height="3" rx="1.5" fill="url(#mriAccent)" opacity="0.55"/>

  <text x="192" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#8C90C4">MRI TUMOR CLASSIFICATION</text>
</svg>
