      <circle cx="20" cy="42" r="5.5" fill="none" stroke="#57E39B" stroke-width="2.5"/>
      <path d="M17.3 42 L19.3 44.3 L23 39.5" fill="none" stroke="#57E39B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="39" width="46" height="6" rx="3" fill="#3A3D6E"/>

      <circle cx="20" cy="66" r="5.5" fill="none" stroke="#57E39B" stroke-width="2.5"/>
