    <radialGradient id="ctGlow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#CBACF9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#CBACF9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="384" height="240" fill="url(#ctBg)"/>
  <circle cx="192" cy="100" r="120" fill="url(#ctGlow)"/>

  <!-- clipboard -->
