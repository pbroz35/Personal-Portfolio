  <path d="M182 98 L208 98" stroke="url(#ctAccent)" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>

  <text x="192" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8C90C4">CLINICAL TRIAL MATCHING</text>
